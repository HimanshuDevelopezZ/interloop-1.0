    <text x="535" y="565" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#A7F3D0" text-anchor="middle" letter-spacing="1">VICTORIA</text>
  </g>

  <!-- 7. TASMANIA (TAS) -->
  <g class="map-state" id="mapStateTAS" data-code="tas" data-name="Tasmania">
    <path d="M 579,621 L 576,622 L 579,635 L 578,640 L 550,644 L 534,634 L 530,633 L 528,636 L 529,650 L 534,658 L 534,674 L 540,685 L 542,685 L 545,690 L 555,692 L 560,688 L 571,686 L 574,676 L 574,668 L 578,666 L 581,653 L 580,637 L 582,634 L 583,625 Z"
