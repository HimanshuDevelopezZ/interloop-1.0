          stroke="#F59E0B"
          stroke-width="2.6"
          stroke-linejoin="round"
          filter="url(#glow-qld)"/>
    <text x="545" y="285" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FDE68A" text-anchor="middle" letter-spacing="1.5">QUEENSLAND</text>
  </g>

  <!-- 5. NEW SOUTH WALES (NSW) & ACT -->
  <g class="map-state" id="mapStateNSW" data-code="nsw" data-name="New South Wales">
    <path d="M 487,509 L 500,510 L 504,515 L 505,521 L 516,522 L 518,532 L 527,538 L 537,549 L 550,547 L 559,551 L 566,551 L 569,554 L 582,553 L 587,561 L 588,569 L 596,575 L 599,575 L 602,579 L 601,585 L 590,585 L 606,586 L 609,582 L 613,581 L 615,575 L 619,575 L 620,573 L 616,572 L 616,566 L 620,561 L 622,561 L 620,560 L 620,556 L 625,545 L 629,541 L 635,540 L 633,539 L 634,527 L 641,526 L 643,524 L 646,510 L 652,503 L 663,499 L 663,496 L 666,495 L 666,488 L 673,482 L 675,474 L 678,473 L 678,462 L 684,448 L 687,446 L 687,440 L 692,433 L 694,423 L 693,418 L 487,418 Z"
          fill="rgba(236, 72, 153, 0.16)"
          stroke="#EC4899"
          stroke-width="2.6"
          stroke-linejoin="round"
          filter="url(#glow-nsw)"/>
    <text x="570" y="470" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="800" fill="#FBCFE8" text-anchor="middle" letter-spacing="1">NEW SOUTH WALES</text>

    <!-- ACT Enclave & Callout -->
    <rect x="598" y="536" width="12" height="12" rx="2" fill="#00E5FF" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="610" y1="542" x2="660" y2="552" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="2 2"/>
    <text x="665" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#00E5FF">CANBERRA / A.C.T.</text>
  </g>

  <!-- 6. VICTORIA (VIC) - HEAD OFFICE HUB -->
  <g class="map-state active-state" id="mapStateVIC" data-code="vic" data-name="Victoria">
    <path d="M 485,511 L 485,583 L 494,583 L 506,591 L 509,591 L 513,595 L 516,595 L 532,587 L 532,575 L 541,574 L 545,577 L 545,583 L 538,589 L 542,590 L 545,596 L 554,599 L 559,599 L 570,591 L 574,590 L 576,584 L 607,584 L 606,582 L 602,581 L 599,576 L 596,576 L 587,569 L 586,561 L 581,553 L 569,555 L 566,552 L 559,552 L 550,548 L 537,550 L 527,539 L 517,532 L 516,523 L 505,522 L 503,520 L 503,515 L 499,510 Z"
