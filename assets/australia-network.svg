  <g class="map-state" id="mapStateQLD" data-code="qld" data-name="Queensland">
    <path d="M 530,85 L 526,99 L 520,104 L 518,123 L 515,128 L 516,157 L 512,163 L 508,183 L 501,192 L 501,197 L 497,201 L 486,203 L 470,193 L 470,185 L 479,180 L 478,178 L 473,178 L 470,181 L 469,186 L 450,182 L 447,178 L 447,353 L 488,354 L 488,417 L 693,417 L 691,384 L 693,381 L 694,368 L 698,366 L 699,360 L 697,357 L 694,364 L 689,365 L 686,362 L 686,356 L 679,351 L 678,343 L 675,340 L 670,339 L 669,332 L 666,328 L 661,327 L 664,313 L 662,307 L 655,307 L 651,303 L 648,306 L 643,305 L 641,281 L 635,273 L 637,264 L 621,255 L 613,246 L 605,244 L 602,239 L 594,233 L 594,209 L 584,187 L 585,178 L 583,176 L 583,157 L 572,148 L 571,144 L 564,144 L 562,146 L 557,145 L 554,134 L 553,112 L 549,106 L 549,99 L 544,96 L 544,85 Z"
