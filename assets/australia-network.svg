<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 740" fill="none" class="australia-network-svg" id="ausMapSvg">
  <defs>
    <!-- Glowing outline drop-shadow filters -->
    <filter id="glow-wa" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#A855F7" flood-opacity="0.75"/>
    </filter>
    <filter id="glow-nt" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#22C55E" flood-opacity="0.75"/>
    </filter>
    <filter id="glow-sa" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#06B6D4" flood-opacity="0.75"/>
    </filter>
    <filter id="glow-qld" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#F59E0B" flood-opacity="0.75"/>
    </filter>
    <filter id="glow-nsw" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#EC4899" flood-opacity="0.75"/>
    </filter>
    <filter id="glow-vic" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#18C58B" flood-opacity="0.95"/>
    </filter>
    <filter id="glow-tas" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38BDF8" flood-opacity="0.75"/>
    </filter>
    <filter id="pin-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#EF4444" flood-opacity="0.9"/>
    </filter>
    <filter id="hq-beacon-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#18C58B" flood-opacity="1"/>
    </filter>

    <style>
      .map-state {
        cursor: pointer;
        transition: transform 0.2s ease, filter 0.2s ease;
      }
      .map-state:hover path {
        filter: brightness(1.3) drop-shadow(0 0 12px currentColor);
        stroke-width: 3.6px !important;
      }
      .corridor-line {
        pointer-events: none;
        stroke-dasharray: 6 6;
        animation: dashFlow 25s linear infinite;
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -120; }
      }
      .pulse-ring {
        transform-origin: 537px 580px;
        animation: radarPulse 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      @keyframes radarPulse {
        0% { r: 6px; opacity: 1; }
        100% { r: 26px; opacity: 0; }
      }
      .city-node {
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .city-node:hover {
        transform: scale(1.18);
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Deep Obsidian Map Base Plate -->
  <rect width="760" height="740" rx="16" fill="#080C10"/>

  <!-- Subtle Latitude & Longitude Navigational Grid -->
  <g stroke="rgba(24, 197, 139, 0.08)" stroke-width="1" stroke-dasharray="4 6">
    <line x1="40" y1="150" x2="720" y2="150"/>
    <line x1="40" y1="300" x2="720" y2="300"/>
    <line x1="40" y1="450" x2="720" y2="450"/>
    <line x1="40" y1="600" x2="720" y2="600"/>
    <line x1="150" y1="40" x2="150" y2="700"/>
    <line x1="300" y1="40" x2="300" y2="700"/>
    <line x1="450" y1="40" x2="450" y2="700"/>
    <line x1="600" y1="40" x2="600" y2="700"/>
  </g>

  <!-- Surrounding Ocean Atmosphere Labels -->
  <text x="60" y="330" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="rgba(164, 191, 183, 0.35)" letter-spacing="2">INDIAN OCEAN</text>
  <text x="625" y="220" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="rgba(164, 191, 183, 0.35)" letter-spacing="2">CORAL SEA</text>
  <text x="640" y="610" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="rgba(164, 191, 183, 0.35)" letter-spacing="2">TASMAN SEA</text>
  <text x="280" y="655" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="rgba(164, 191, 183, 0.35)" letter-spacing="2">SOUTHERN OCEAN</text>
  <text x="320" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="rgba(164, 191, 183, 0.35)" letter-spacing="2">TIMOR &amp; ARAFURA SEAS</text>

  <!-- ========================================================================
       CLEAR STATE OUTLINES WITH BOLD BORDERS (As provided in images)
       ======================================================================== -->
  
