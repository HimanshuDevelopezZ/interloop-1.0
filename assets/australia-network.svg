  <g class="map-state" id="mapStateWA" data-code="wa" data-name="Western Australia">
    <path d="M 295,134 L 293,134 L 292,137 L 294,147 L 285,148 L 284,146 L 274,147 L 273,145 L 267,144 L 263,140 L 262,136 L 256,132 L 250,131 L 248,128 L 239,133 L 228,133 L 226,131 L 224,133 L 224,137 L 221,139 L 221,143 L 213,146 L 215,153 L 210,154 L 208,160 L 202,161 L 201,168 L 204,173 L 204,177 L 199,179 L 190,177 L 188,179 L 186,188 L 189,189 L 189,194 L 184,195 L 183,189 L 181,189 L 180,185 L 177,184 L 175,185 L 171,194 L 166,196 L 166,219 L 162,224 L 160,224 L 160,227 L 157,229 L 157,235 L 146,248 L 127,257 L 116,256 L 110,261 L 109,264 L 96,267 L 90,274 L 75,271 L 73,276 L 69,278 L 65,284 L 58,287 L 56,294 L 46,299 L 42,304 L 38,304 L 34,301 L 31,304 L 29,322 L 33,331 L 33,337 L 30,338 L 29,352 L 32,355 L 32,359 L 35,359 L 37,364 L 40,366 L 40,371 L 33,374 L 29,374 L 27,371 L 26,379 L 31,382 L 34,389 L 45,398 L 45,401 L 48,403 L 48,407 L 52,408 L 52,415 L 61,424 L 62,429 L 65,430 L 70,437 L 74,459 L 82,470 L 80,485 L 87,485 L 90,488 L 91,511 L 89,513 L 81,514 L 86,530 L 92,529 L 102,537 L 126,537 L 128,535 L 135,536 L 135,533 L 139,532 L 139,529 L 144,523 L 151,523 L 153,521 L 153,517 L 157,513 L 167,513 L 168,511 L 179,507 L 191,507 L 192,510 L 197,510 L 199,506 L 207,506 L 208,508 L 211,508 L 212,506 L 216,506 L 218,504 L 222,491 L 225,490 L 226,487 L 235,487 L 237,482 L 247,478 L 248,473 L 269,473 L 274,470 L 279,471 L 285,466 L 294,464 Z"
          fill="rgba(157, 110, 255, 0.16)"
          stroke="#A855F7"
          stroke-width="2.6"
          stroke-linejoin="round"
          filter="url(#glow-wa)"/>
    <text x="180" y="370" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#E9D5FF" text-anchor="middle" letter-spacing="1.5">WESTERN AUSTRALIA</text>
  </g>

  <!-- 2. NORTHERN TERRITORY (NT) -->
  <g class="map-state" id="mapStateNT" data-code="nt" data-name="Northern Territory">
    <path d="M 305,85 L 303,89 L 304,91 L 314,91 L 315,96 L 313,103 L 309,104 L 309,109 L 305,110 L 305,121 L 299,123 L 299,128 L 296,132 L 296,353 L 446,353 L 446,176 L 443,172 L 439,172 L 438,169 L 434,169 L 432,165 L 419,160 L 417,156 L 405,149 L 405,144 L 413,134 L 415,128 L 421,129 L 421,135 L 423,137 L 431,137 L 431,127 L 428,125 L 415,125 L 414,120 L 425,116 L 427,108 L 432,102 L 432,98 L 428,96 L 425,91 L 421,93 L 407,91 L 405,95 L 398,95 L 392,92 L 381,92 L 375,87 L 366,88 L 365,86 L 350,85 L 349,96 L 330,98 L 324,94 L 324,90 L 329,85 Z"
