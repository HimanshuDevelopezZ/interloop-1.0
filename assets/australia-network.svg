    <text x="370" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#BBF7D0" text-anchor="middle" letter-spacing="1">NORTHERN TERRITORY</text>
  </g>

  <!-- 3. SOUTH AUSTRALIA (SA) -->
  <g class="map-state" id="mapStateSA" data-code="sa" data-name="South Australia">
    <path d="M 296,354 L 296,461 L 306,458 L 336,457 L 349,466 L 356,464 L 363,469 L 373,471 L 377,474 L 377,482 L 380,487 L 386,487 L 389,491 L 389,496 L 395,501 L 394,513 L 396,513 L 401,520 L 406,520 L 407,511 L 416,500 L 427,496 L 430,490 L 434,490 L 435,497 L 431,500 L 429,505 L 429,517 L 421,519 L 419,524 L 421,526 L 432,526 L 434,520 L 439,519 L 442,529 L 439,530 L 437,534 L 432,534 L 430,531 L 416,534 L 413,537 L 419,541 L 429,541 L 431,538 L 438,538 L 440,534 L 451,533 L 459,539 L 462,546 L 462,557 L 460,558 L 460,562 L 468,572 L 469,576 L 473,580 L 481,581 L 487,584 L 487,354 Z"
