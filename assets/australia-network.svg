    <text x="562" y="715" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#BAE6FD" text-anchor="middle" letter-spacing="1">TASMANIA</text>
  </g>

  <!-- ========================================================================
       INTERSTATE FREIGHT CORRIDORS (Connecting Victoria HQ to all Capitals)
       ======================================================================== -->
  <g class="freight-corridors">
    <!-- Melbourne HQ (537, 580) to Sydney (637, 520) - Hume Highway -->
    <path d="M 537 580 Q 590 555 637 520" stroke="#18C58B" stroke-width="3.5" opacity="0.9"/>
    <path d="M 537 580 Q 590 555 637 520" stroke="#FFFFFF" stroke-width="1.2" class="corridor-line" opacity="0.85"/>

    <!-- Sydney (637, 520) to Brisbane (685, 406) - Pacific Highway -->
    <path d="M 637 520 Q 670 460 685 406" stroke="#18C58B" stroke-width="3" opacity="0.85"/>
    <path d="M 637 520 Q 670 460 685 406" stroke="#FFFFFF" stroke-width="1.2" class="corridor-line" opacity="0.8"/>

    <!-- Melbourne HQ (537, 580) to Adelaide (444, 518) - Western Highway -->
    <path d="M 537 580 Q 485 545 444 518" stroke="#18C58B" stroke-width="3" opacity="0.85"/>
    <path d="M 537 580 Q 485 545 444 518" stroke="#FFFFFF" stroke-width="1.2" class="corridor-line" opacity="0.8"/>

    <!-- Adelaide (444, 518) to Perth (93, 479) - Eyre Highway -->
    <path d="M 444 518 Q 260 480 93 479" stroke="#10B981" stroke-width="2.2" stroke-dasharray="6 6" opacity="0.75"/>

    <!-- Adelaide (444, 518) to Darwin (319, 101) - Stuart Highway -->
    <path d="M 444 518 Q 380 300 319 101" stroke="#10B981" stroke-width="2.2" stroke-dasharray="6 6" opacity="0.75"/>

    <!-- Melbourne HQ (537, 580) to Hobart (562, 681) - Bass Strait Sea-Link -->
    <path d="M 537 580 Q 548 630 562 681" stroke="#06B6D4" stroke-width="2.2" stroke-dasharray="5 5" opacity="0.8"/>
  </g>

  <!-- ========================================================================
       CAPITAL CITY NODES & PINS (From Image 1 & Image 2)
       ======================================================================== -->
  <g class="capital-pins">
    <!-- 1. Perth (WA) -->
    <g class="city-node" transform="translate(93, 479)">
      <circle cx="0" cy="0" r="6" fill="#EF4444" filter="url(#pin-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
      <text x="-10" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="end">Perth</text>
    </g>

    <!-- 2. Darwin (NT) -->
    <g class="city-node" transform="translate(319, 101)">
      <circle cx="0" cy="0" r="6" fill="#EF4444" filter="url(#pin-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
      <text x="-10" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="end">Darwin</text>
    </g>

    <!-- 3. Adelaide (SA) -->
    <g class="city-node" transform="translate(444, 518)">
      <circle cx="0" cy="0" r="6" fill="#EF4444" filter="url(#pin-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
      <text x="-10" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="end">Adelaide</text>
    </g>

    <!-- 4. Brisbane (QLD) -->
    <g class="city-node" transform="translate(685, 406)">
      <circle cx="0" cy="0" r="6" fill="#EF4444" filter="url(#pin-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
      <text x="12" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="start">Brisbane</text>
    </g>

    <!-- 5. Sydney (NSW) -->
    <g class="city-node" transform="translate(637, 520)">
      <circle cx="0" cy="0" r="6" fill="#EF4444" filter="url(#pin-glow)"/>
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
      <text x="12" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="start">Sydney</text>
    </g>

    <!-- 6. Hobart (TAS) -->
    <g class="city-node" transform="translate(562, 681)">
      <circle cx="0" cy="0" r="5" fill="#EF4444" filter="url(#pin-glow)"/>
      <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
      <text x="10" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="start">Hobart</text>
    </g>

    <!-- 7. MELBOURNE VIC (HEAD OFFICE HUB) - PROMINENT CALLOUT BEACON -->
    <g class="hq-beacon-node" transform="translate(537, 580)">
      <circle cx="0" cy="0" r="8" fill="none" stroke="#18C58B" stroke-width="1.8" class="pulse-ring"/>
      <circle cx="0" cy="0" r="10" fill="#18C58B" filter="url(#hq-beacon-glow)"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
      
      <!-- HQ Pin Box -->
      <g transform="translate(-80, 15)">
        <rect width="160" height="28" rx="6" fill="#063D35" stroke="#18C58B" stroke-width="1.6" filter="url(#glow-vic)"/>
        <text x="80" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">★ MELBOURNE VIC HQ</text>
      </g>
    </g>
  </g>

  <!-- Title Badge Overlay (Matching Neon Atlas from Image 2) -->
  <g transform="translate(380, 36)" text-anchor="middle">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="10" filter="drop-shadow(0 0 8px rgba(24,197,139,0.8))">AUSTRALIA</text>
    <text x="0" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#18C58B" letter-spacing="3.5">6 STATES &amp; 2 TERRITORIES • NATIONAL CORRIDORS</text>
  </g>
</svg>